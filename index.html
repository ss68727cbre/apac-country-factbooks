<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APAC Enterprise Country Factbooks</title>
<meta name="description" content="CBRE Enterprise Accounts country overviews across Asia Pacific">
<style>
  /* ---------- CBRE brand tokens ---------- */
  :root{
    --cbre-green:#003F2D;
    --cbre-dark:#012A2D;
    --cbre-accent:#17E88F;
    --cbre-celadon:#80BBAD;
    --cbre-sage:#538184;
    --cbre-wheat:#DBD99A;
    --cbre-midnight:#032842;
    --cbre-light-grey:#CAD1D3;
    --cbre-grey:#7F8480;
    --cbre-dark-grey:#435254;
    --panel:#D6D9D6;
    --text:#1A1A1A;
    --bg:#F5F7F7;
    --tile-border:#E1E5E6;
    --serif:"Financier Display","Georgia","Times New Roman",serif;
    --sans:"Calibre","Segoe UI","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .hidden{display:none !important}

  /* ---------- Landing page ---------- */
  .landing-banner{
    position:relative;height:150px;
    background:linear-gradient(rgba(1,42,45,.72),rgba(1,42,45,.72)),
               linear-gradient(135deg,#2b4a4c 0%,#5d7c7e 50%,#8fa6a8 100%);
    background-size:cover;background-position:center;
    display:flex;align-items:center;
  }
  .landing-banner.has-image{background-image:linear-gradient(rgba(1,42,45,.65),rgba(1,42,45,.65)),var(--banner-img)}
  .landing-banner h1{
    margin:0;padding:0 40px;color:#fff;font-family:var(--sans);font-weight:600;
    font-size:32px;letter-spacing:.2px;
  }
  .landing-wrap{max-width:1280px;margin:0 auto;padding:36px 24px 60px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
  @media (max-width:1000px){.tiles{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:720px){.tiles{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:460px){.tiles{grid-template-columns:1fr}}
  .tile{
    display:block;text-decoration:none;background:#fff;border:1px solid var(--tile-border);
    border-radius:6px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .tile:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(0,63,45,.18)}
  .tile.disabled{pointer-events:none;opacity:.55}
  .tile-img{
    position:relative;height:150px;
    background:linear-gradient(160deg,#003F2D 0%,#1c5c4a 55%,#80BBAD 100%);
    background-size:cover;background-position:center;
    display:flex;align-items:center;justify-content:center;
  }
  .tile-img span{
    color:#fff;font-family:var(--serif);font-size:44px;font-weight:500;
    text-shadow:0 2px 10px rgba(0,0,0,.55);letter-spacing:.5px;text-align:center;line-height:1;
    padding:0 8px;
  }
  .tile-img span.long{font-size:34px}
  .tile-cap{padding:16px 14px;font-size:14px;color:var(--dark-grey,#333)}
  .tile-cap small{display:block;color:var(--cbre-grey);margin-top:4px;font-size:12px}
  .landing-foot{margin-top:40px;font-size:12px;color:var(--cbre-grey)}

  /* ---------- Country page ---------- */
  .country-nav{
    background:#fff;border-bottom:1px solid var(--tile-border);
    padding:10px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;
    position:sticky;top:0;z-index:5;
  }
  .country-nav a.back{text-decoration:none;color:var(--cbre-green);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
  .country-nav a.back:hover{text-decoration:underline}
  .country-nav select{
    font-family:var(--sans);font-size:14px;padding:6px 10px;border:1px solid var(--cbre-light-grey);
    border-radius:4px;background:#fff;color:var(--text);
  }
  .country-page{background:var(--cbre-green);color:#fff;min-height:calc(100vh - 50px)}
  .cp-inner{max-width:1600px;margin:0 auto;padding:46px 56px 24px}

  /* header row */
  .cp-head{display:grid;grid-template-columns:400px 1fr;gap:32px;align-items:start}
  @media (max-width:1100px){.cp-head{grid-template-columns:1fr}}
  .cp-kicker{font-size:17px;letter-spacing:.42em;color:var(--cbre-accent);font-weight:400;text-transform:uppercase;margin:0 0 6px}
  .cp-title{font-family:var(--serif);font-size:84px;line-height:1;margin:0;padding-bottom:14px;border-bottom:3px solid #fff;display:inline-block;font-weight:400}
  @media (max-width:700px){.cp-title{font-size:56px}}
  .cp-subtitle{font-family:var(--serif);font-size:30px;line-height:1.1;margin-top:10px;color:#fff}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);row-gap:26px;column-gap:20px}
  @media (max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{display:flex;gap:14px;align-items:flex-start}
  .stat svg{width:52px;height:52px;flex:0 0 52px;stroke:#fff;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
  .stat .num{font-size:38px;line-height:1;color:var(--cbre-accent);font-weight:400;letter-spacing:-.5px}
  .stat .lbl{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-top:6px;line-height:1.3}
  .stat .lbl small{font-weight:400;text-transform:none;letter-spacing:0;font-size:12px}
  .entity .elbl{color:var(--cbre-accent);font-size:15px;letter-spacing:.06em;text-transform:uppercase}
  .entity .ename{font-family:var(--serif);font-size:27px;margin:4px 0 2px}
  .entity .eowner{font-size:14px}
  .entity a{color:#fff;font-size:15px;text-decoration:underline}

  .rule{height:7px;background:var(--cbre-accent);margin:34px 0 36px}

  /* body columns */
  .cp-body{display:grid;grid-template-columns:1.15fr 1.1fr .5fr;gap:0}
  @media (max-width:1250px){.cp-body{grid-template-columns:1fr 1fr}.cp-col.contacts{grid-column:1/-1;border-left:0;border-top:1px solid rgba(255,255,255,.35);padding:28px 0 0;margin-top:28px}}
  @media (max-width:820px){.cp-body{grid-template-columns:1fr}.cp-col{border-left:0 !important;padding-left:0 !important;padding-right:0 !important}}
  .cp-col{padding:0 28px}
  .cp-col:first-child{padding-left:0}
  .cp-col:last-child{padding-right:0}
  .cp-col+.cp-col{border-left:1px solid rgba(255,255,255,.55)}
  .cp-col h2{font-size:20px;font-weight:700;margin:0 0 18px}

  /* operations */
  .ops{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
  @media (max-width:560px){.ops{grid-template-columns:1fr}}
  .map-box{position:relative;background:#e8ebe9;border-radius:3px;overflow:hidden;aspect-ratio:1/1.35;min-height:300px}
  /* My Maps embed: header kept visible so the back arrow works after a marker is clicked;
     the Google profile is hidden via the noprof=1 URL parameter */
  .map-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .map-box .map-placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:var(--cbre-dark-grey);font-size:13px;text-align:center;padding:20px;background:repeating-linear-gradient(45deg,#e8ebe9,#e8ebe9 12px,#e1e5e3 12px,#e1e5e3 24px)}
  .map-link{display:inline-block;margin-top:10px;font-size:12px;color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.6);padding:5px 10px;border-radius:3px}
  .map-link:hover{background:rgba(255,255,255,.12)}
  .donut-wrap{display:flex;flex-direction:column;align-items:center;background:var(--panel);color:var(--text);padding:22px 20px 16px;border-radius:2px}
  .donut{width:100%;max-width:230px;height:auto}
  .donut text{font-family:var(--sans);fill:var(--text)}
  .legend{list-style:none;margin:14px 0 0;padding:0;width:100%;max-width:280px}
  .legend li{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.14);font-size:14px}
  .legend li:last-child{border-bottom:0}
  .legend i{display:inline-block;width:11px;height:11px;flex:0 0 11px;border:1px solid #1A1A1A}
  .legend b{margin-left:auto;font-weight:400;font-family:var(--serif);font-size:16px}

  /* capabilities */
  table.cap{width:100%;border-collapse:collapse;font-size:13px}
  table.cap thead th{background:#fff;color:var(--cbre-green);font-weight:700;text-align:left;padding:9px 8px;font-size:12.5px}
  table.cap thead th:first-child{border-radius:2px 0 0 0}
  table.cap tbody td{padding:5px 8px;border-bottom:1px solid var(--cbre-accent);vertical-align:middle;line-height:1.3}
  table.cap tbody td.cat{font-weight:400;border-bottom:1px solid var(--cbre-accent)}
  table.cap tbody td.val{text-align:center;width:150px}
  table.cap td.val.self{color:rgba(255,255,255,.65)}
  table.cap td.cat{width:110px}

  /* contacts */
  .contact-card{background:var(--panel);color:var(--text);padding:28px 24px;border-radius:2px}
  .contact{margin-bottom:26px}
  .contact:last-child{margin-bottom:0}
  .contact .cname{font-family:var(--serif);font-size:26px;line-height:1.1}
  .contact .crole{font-size:14px;margin:4px 0 10px}
  .contact a{display:block;font-size:14px;color:var(--text);margin-bottom:2px}
  .contact .cphone{font-size:14px}

  .cp-foot{display:flex;justify-content:space-between;font-size:11px;color:rgba(255,255,255,.9);margin-top:34px}

  @media (max-width:820px){.page-break{margin-left:-24px;margin-right:-24px}}
  .p2-head{display:grid;grid-template-columns:400px 1fr;gap:32px;align-items:start}
  @media (max-width:1100px){.p2-head{grid-template-columns:1fr}}
  .p2-title{font-family:var(--serif);font-size:48px;line-height:1.05;margin:0;font-weight:400}
  .p2-title em{font-style:normal;color:var(--cbre-accent)}
  @media (max-width:700px){.p2-title{font-size:36px}}
  .p2-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:start}
  @media (max-width:900px){.p2-cards{grid-template-columns:1fr}}
  .p2-cards h2{font-size:17px;font-weight:700;margin:0 0 10px}
  .fact-card{background:var(--panel);color:var(--text);padding:18px 18px 16px;border-radius:2px;min-height:100%}
  .fact-card .ftitle{font-family:var(--serif);font-size:21px;line-height:1.15;margin:0 0 8px}
  .fact-card p{margin:0 0 8px;font-size:13px;line-height:1.45}
  .fact-card p:last-child{margin-bottom:0}
  .p2-body{display:grid;grid-template-columns:1fr 1.15fr 1.15fr;gap:0}
  @media (max-width:1250px){.p2-body{grid-template-columns:1fr 1fr}.p2-body .cp-col.p2-contacts{grid-column:1/-1;border-left:0;border-top:1px solid rgba(255,255,255,.35);padding:28px 0 0;margin-top:28px}}
  @media (max-width:820px){.p2-body{grid-template-columns:1fr}}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px;margin-bottom:22px}
  .kpi .num{font-size:34px;line-height:1;color:var(--cbre-accent);letter-spacing:-.5px}
  .kpi .lbl{font-size:13px;margin-top:6px;line-height:1.3}
  ul.p2-bullets{margin:0;padding-left:18px;font-size:14px;line-height:1.45}
  ul.p2-bullets li{margin-bottom:10px}
  ul.p2-bullets li::marker{color:var(--cbre-accent)}
  .p2-sub{font-size:20px;font-weight:700;margin:30px 0 14px}
  .customers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  @media (max-width:560px){.customers{grid-template-columns:repeat(2,1fr)}}
  .customers span{background:var(--panel);color:var(--text);font-size:13px;text-align:center;padding:8px 6px;border-radius:2px;line-height:1.2;display:flex;align-items:center;justify-content:center;min-height:36px}
  .kcontacts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 14px}
  @media (max-width:560px){.kcontacts{grid-template-columns:repeat(2,1fr)}}
  .kc .krole{color:var(--cbre-accent);font-size:11px;letter-spacing:.06em;text-transform:uppercase;line-height:1.25}
  .kc .kname{font-size:15px;margin-top:3px;line-height:1.2}
  .kc a{display:block;font-size:11.5px;color:#fff;word-break:break-all;margin-top:2px}
  .locations{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media (max-width:560px){.locations{grid-template-columns:1fr}}
  .loc .lname{font-weight:700;font-size:14px;margin-bottom:4px}
  .loc .laddr{font-size:13px;line-height:1.4}

  @media print{
    .country-nav{display:none}
    .country-page{min-height:0}
  }
</style>
</head>

const $ = s => document.querySelector(s);

function renderLanding(){
  const tiles = $("#tiles");
  tiles.innerHTML = COUNTRIES.map(c => {
    const longName = c.name.length > 9 ? " long" : "";
    const disabled = c.data ? "" : " disabled";
    const title = c.data ? "" : ' title="Coming soon"';
    return `<a class="tile${disabled}" href="#${c.key}"${title}>
      <div class="tile-img" style="background-image:url('images/${c.key}.jpg'),linear-gradient(160deg,#003F2D 0%,#1c5c4a 55%,#80BBAD 100%)"><span class="${longName.trim()}">${c.name}</span></div>
      <div class="tile-cap">${c.caption}${c.data ? "" : "<small>Coming soon</small>"}</div>
    </a>`;
  }).join("");

  const jump = $("#jump");
  jump.innerHTML = COUNTRIES.filter(c=>c.data).map(c=>`<option value="${c.key}">${c.name}</option>`).join("");
  jump.onchange = e => location.hash = e.target.value;
}

function fmt(n){ return typeof n === "number" ? n.toLocaleString("en-US") : n; }
function note(s){ return s ? ` <small>${s}</small>` : ""; }

function stat(icon, num, label){
  if (num === null || num === undefined || num === "") return "";   /* KPI not on this country's slide */
  return `<div class="stat">${ICONS[icon]}<div><div class="num">${fmt(num)}</div><div class="lbl">${label}</div></div></div>`;
}

function donut(sectors){
  const total = sectors.reduce((s,[,v])=>s+v,0) || 1;
  const r = 44, cx = 60, cy = 60, circ = 2*Math.PI*r;
  let offset = 0;
  const segs = sectors.map(([name,v])=>{
    const len = circ * v/total;
    const seg = `<circle r="${r}" cx="${cx}" cy="${cy}" fill="none" stroke="${SECTOR_COLORS[name]||"#435254"}" stroke-width="18"
      stroke-dasharray="${len} ${circ-len}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += len; return seg;
  }).join("");
  return `<svg class="donut" viewBox="0 0 120 120" role="img" aria-label="Clients by sector">
    <circle r="${r}" cx="${cx}" cy="${cy}" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="18"/>
    ${segs}
    <circle r="${r+9}" cx="${cx}" cy="${cy}" fill="none" stroke="#1A1A1A" stroke-width=".8"/>
    <circle r="${r-9}" cx="${cx}" cy="${cy}" fill="none" stroke="#1A1A1A" stroke-width=".8"/>
    <text x="${cx}" y="${cy-5}" text-anchor="middle" font-size="9.5">Clients by</text>
    <text x="${cx}" y="${cy+7}" text-anchor="middle" font-size="9.5">Sector</text>
  </svg>
  <ul class="legend">${sectors.map(([name,v])=>`<li><i style="background:${SECTOR_COLORS[name]||"#435254"}"></i>${name}<b>${v}%</b></li>`).join("")}</ul>`;
}

function capTable(rows){
  const body = rows.map(group=>{
    const [cat, ...items] = group;
    return items.map((it,i)=>{
      const cls = it[1]==="Self Delivery" ? " self" : "";
      return `<tr>${i===0?`<td class="cat" rowspan="${items.length}">${cat}</td>`:""}<td>${it[0]}</td><td class="val${cls}">${it[1]}</td></tr>`;
    }).join("");
  }).join("");
  return `<table class="cap"><thead><tr><th>Services Category</th><th>Services Sub-Category</th><th>Capabilities</th></tr></thead><tbody>${body}</tbody></table>`;
}

function mapBlock(d, name){
  if (d.mapEmbed){
    return `<div class="map-box"><iframe src="${d.mapEmbed}" loading="lazy" title="${name} site map"></iframe></div>`;
  }
  return `<div class="map-box"><div class="map-placeholder"><strong>${name} site map</strong><span>Google My Maps embed pending</span></div></div>`;
}

      </div>
    </div>
    <div class="cp-foot"><span>Confidential &amp; Proprietary | &copy; 2026 CBRE, Inc.</span><span>${c.name}</span></div>
    ${renderPage2(c)}`;
  $("#jump").value = c.key;
  document.title = `${c.name} | APAC Enterprise Country Factbooks`;
}

function route(){
  const key = (location.hash || "#home").slice(1);
  const c = COUNTRIES.find(x=>x.key===key && x.data);
  if (c){
    $("#landing").classList.add("hidden");
    $("#country").classList.remove("hidden");
    renderCountry(c);
    window.scrollTo(0,0);
  } else {
    $("#country").classList.add("hidden");
    $("#landing").classList.remove("hidden");
    document.title = "APAC Enterprise Country Factbooks";
    if (key !== "home") history.replaceState(null,"","#home");
  }
}

renderLanding();
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
